<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🛡 <span>SecurePass</span>
    </div>

    <ul class="nav-links">

        <li><a href="index.html">Home</a></li>
        <li><a href="voice.html">Voice</a></li>
        <li><a href="face.html">Face</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="users.html">Users</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="index.html" onclick="return confirm('Logout from SecurePass?')">Logout</a></li>

    </ul>

</nav>

<div class="container">

    <h1>📊 Admin Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h2 id="users">0</h2>
            <p>👥 Total Users</p>
        </div>

        <div class="card">
            <h2 id="voice">0</h2>
            <p>🎤 Voice Logins</p>
        </div>

        <div class="card">
            <h2 id="face">0</h2>
            <p>😀 Face Logins</p>
        </div>

        <div class="card">
            <h2 id="total">0</h2>
            <p>🔐 Total Successful Logins</p>
        </div>

    </div>

    <br><br>

    <h2>📋 Login History</h2>

    <div class="table-container">

<table>

<thead>

<tr>
<th>Username</th>
<th>Method</th>
<th>Status</th>
<th>Date & Time</th>
</tr>

</thead>

<tbody id="history">

</tbody>

</table>

</div>

</div>

<script src="dashboard.js"></script>

</body>

</html>
